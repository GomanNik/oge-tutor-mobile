name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PNPM_VERSION: 9.15.9
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oge_tutor_ci?schema=public
  JWT_SECRET: ci-test-secret
  PUBLIC_BACKEND_URL: http://localhost:3000
  APP_FRONTEND_URL: http://localhost:5173
  FRONTEND_ORIGIN: http://localhost:5173
  MAILER_PROVIDER: noop
  VITE_API_BASE_URL: http://localhost:3000
  VITE_USE_MOCK: "false"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --dir oge-tutor-backend run prisma:generate

      - name: Build backend
        run: pnpm --dir oge-tutor-backend run build

      - name: Lint backend
        run: pnpm --dir oge-tutor-backend run lint

      - name: Test backend
        run: pnpm --dir oge-tutor-backend test

      - name: Check backup scripts
        run: |
          bash -n scripts/backup.sh scripts/backup-common.sh scripts/verify-backup.sh scripts/check-backups.sh scripts/install-backup-timer.sh
          bash scripts/tests/backup-tests.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --dir oge-tutor-app run build

      - name: Lint frontend
        run: pnpm --dir oge-tutor-app run lint

      - name: Typecheck frontend
        run: pnpm --dir oge-tutor-app run typecheck

      - name: Test frontend
        run: pnpm --dir oge-tutor-app test

      - name: Install browser for viewport tests
        run: pnpm --dir oge-tutor-app exec playwright install --with-deps chromium

      - name: Test frontend viewport and keyboard
        run: pnpm --dir oge-tutor-app run test:browser

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-results
          path: oge-tutor-app/test-results/

  prisma-db-check:
    name: Prisma Migration Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oge_tutor_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oge_tutor_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oge_tutor_ci?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --dir oge-tutor-backend run prisma:generate

      - name: Apply migrations
        run: pnpm --dir oge-tutor-backend exec prisma migrate deploy

      - name: Check migration status
        run: pnpm --dir oge-tutor-backend exec prisma migrate status

      - name: Check schema drift
        run: pnpm --dir oge-tutor-backend exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Verify legacy migration and database constraints
        run: pnpm --dir oge-tutor-backend run test:migrations

  e2e:
    name: AppModule E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oge_tutor_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oge_tutor_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oge_tutor_e2e?schema=public
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oge_tutor_e2e?schema=public
      JWT_SECRET: e2e-test-secret
      PUBLIC_BACKEND_URL: http://localhost:3000
      APP_FRONTEND_URL: http://localhost:5173
      FRONTEND_ORIGIN: http://localhost:5173
      MAILER_PROVIDER: noop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --dir oge-tutor-backend run prisma:generate

      - name: Apply migrations
        run: pnpm --dir oge-tutor-backend exec prisma migrate deploy

      - name: Run AppModule e2e tests
        run: pnpm --dir oge-tutor-backend run test:e2e

      - name: Build restored API
        run: pnpm --dir oge-tutor-backend run build

      - name: Restore database and files, then verify real API workflows
        env:
          RELEASE_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          RELEASE_DRILL_REPORT: test-results/release-restore-drill.json
        run: pnpm --dir oge-tutor-backend run test:restore

      - name: Upload restore proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-restore-proof
          path: oge-tutor-backend/test-results/release-restore-drill.json

  browser-real-api:
    name: Browser Real API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oge_tutor_browser_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oge_tutor_browser_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oge_tutor_browser_ci?schema=public
      VITE_API_BASE_URL: http://127.0.0.1:3000
      PUBLIC_BACKEND_URL: http://127.0.0.1:3000
      APP_FRONTEND_URL: http://127.0.0.1:5199
      FRONTEND_ORIGIN: http://127.0.0.1:5199
      REAL_API_EMAIL: browser-admin@test.local
      REAL_API_PASSWORD: BrowserSmoke-CI-2026!
      COURSE_REAL_API_EMAIL: teacher@mail.ru
      COURSE_REAL_API_PASSWORD: BrowserCourse-CI-2026!
      LESSON_REAL_API_EMAIL: teacher@mail.ru
      LESSON_REAL_API_PASSWORD: BrowserCourse-CI-2026!
      LESSON_REAL_API_STUDENT_EMAIL: ivan@mail.ru
      LESSON_REAL_API_STUDENT_PASSWORD: BrowserCourse-CI-2026!
      LESSON_REAL_API_STUDENT_A_NAME: Иван Петров
      LESSON_REAL_API_STUDENT_B_NAME: Мария Соколова
      LEARNING_REAL_API_EMAIL: learning-teacher@test.local
      LEARNING_REAL_API_PASSWORD: BrowserCourse-CI-2026!
      LEARNING_REAL_API_STUDENT_EMAIL: learning-student@test.local
      LEARNING_REAL_API_STUDENT_PASSWORD: BrowserCourse-CI-2026!
      SERIES_REAL_API_EMAIL: series-teacher@test.local
      SERIES_REAL_API_PASSWORD: BrowserCourse-CI-2026!
      SERIES_REAL_API_STUDENT_EMAIL: series-student@test.local
      ACCOUNT_REAL_API_EMAIL: account@test.local
      ACCOUNT_REAL_API_PASSWORD: BrowserCourse-CI-2026!
      LEARNING_NOTIFICATIONS_WORKER_ENABLED: "false"
      LESSON_SERIES_WORKER_ENABLED: "false"
      WORKSPACE_INVITATIONS_WORKER_ENABLED: "false"
      WORKSPACE_ADMIN_EMAIL: browser-admin@test.local
      WORKSPACE_ADMIN_PASSWORD: BrowserSmoke-CI-2026!
      WORKSPACE_ADMIN_NAME: Browser Admin
      WORKSPACE_NAME: Browser Workspace
      MAILER_PROVIDER: noop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --dir oge-tutor-backend run prisma:generate

      - name: Apply migrations and bootstrap
        run: |
          pnpm --dir oge-tutor-backend exec prisma migrate deploy
          pnpm --dir oge-tutor-backend run workspace:operator bootstrap
          pnpm --dir oge-tutor-backend exec ts-node --project tsconfig.json prisma/browser-course-seed.ts

      - name: Build backend
        run: pnpm --dir oge-tutor-backend run build

      - name: Install browser
        run: pnpm --dir oge-tutor-app exec playwright install --with-deps chromium

      - name: Test browser against real API
        run: |
          node oge-tutor-backend/dist/src/main.js &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/health >/dev/null
          pnpm --dir oge-tutor-app exec playwright test --grep 'real API' --output test-results/real-api
          kill "$api_pid"
          wait "$api_pid" || true
          LEGACY_API_MODE=disabled LEGACY_CUTOVER_CONFIRM=verified-backup-and-reconciliation node oge-tutor-backend/dist/src/main.js &
          api_pid=$!
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health/ready >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/health/ready >/dev/null
          CUTOVER_REAL_API=true pnpm --dir oge-tutor-app exec playwright test --grep 'cutover real API' --output test-results/cutover

      - name: Upload real API screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-api-browser-results
          path: oge-tutor-app/test-results/

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f oge-tutor-backend/Dockerfile -t oge-tutor-backend:ci .

      - name: Build frontend image
        run: docker build -f oge-tutor-app/Dockerfile --build-arg VITE_API_BASE_URL=http://localhost:3000 -t oge-tutor-frontend:ci .

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit workspace dependencies
        run: pnpm run audit
